<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">

  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      position: fixed;
      bottom: 0;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <div class="product-preview-card">
    <div class="product-image">
      <picture>
        <source
         media="(max-width: 600px)"
          srcset="images/image-product-mobile.jpg">
      <img src="images/image-product-desktop.jpg" alt="product image">
      </picture>
    </div>
    <div class="product-info">
      <div class="product">Perfume</div>

      <div class="product-name">Gabrielle Essence Eau De Parfum</div>

      <div class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</div>

      <div class="product-prices">
        <div class="product-price-sale">$149.99</div>
        <div class="product-price">$169.99</div>
      </div>

      <div class="cart-button">
        <button class="add-cart-button"><img src="images/icon-cart.svg" alt="cart icon">Add to Cart</button>
      </div>
    </div>
  </div>
  <!--<footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Dimpho Sethiba</a>.
  </footer> -->
</body>

</html>
